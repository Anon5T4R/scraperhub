<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScraperHub (uso pessoal/estudo)</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f8cff;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --border: #262b34;
    --ok: #37c98b;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 24px 20px 8px;
    max-width: 960px;
    margin: 0 auto;
  }
  header h1 { margin: 0; font-size: 22px; }
  header .tag { color: var(--muted); font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 12px 20px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .hidden { display: none; }
  label { font-size: 14px; color: var(--muted); }
  input[type="url"], input[type="text"], textarea {
    width: 100%;
    background: #0c0e12;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 88px; font-size: 14px; }
  select {
    background: #0c0e12;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    font-size: 14px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.between { justify-content: space-between; }
  .row input { flex: 1; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--err); font-size: 13px; }
  .result-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
  .cover { width: 96px; border-radius: 10px; object-fit: cover; }
  .result-meta h2 { margin: 0 0 4px; font-size: 18px; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 14px; }
  .chapters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .chapter { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  .chapter:hover { background: #12151b; }
  .search-results { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .search-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .search-title { font-size: 14px; font-weight: 600; }
  .search-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .search-actions button { padding: 8px 12px; }
  .task { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #2a303b; }
  .badge.running { background: #1d3a5c; color: #9cc4ff; }
  .badge.done { background: #14382a; color: var(--ok); }
  .badge.error { background: #3a1b1b; color: var(--err); }
  .bar { height: 8px; background: #0c0e12; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); transition: width .3s ease; }
  .fill.done { background: var(--ok); }
  .fill.error { background: var(--err); }
  .log {
    margin: 10px 0 0;
    background: #0c0e12;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>ScraperHub <span class="tag">(uso pessoal/estudo)</span></h1>
</header>
<main>
  <section class="card">
    <label for="search">Buscar anime por nome</label>
    <div class="row" style="margin-top:8px">
      <input id="search" type="text" placeholder="Buscar anime por nome..." autocomplete="off" spellcheck="false">
      <button id="search-btn">Buscar</button>
    </div>
    <p id="search-status" class="muted" style="margin:10px 0 0"></p>
    <div id="search-results" class="search-results hidden"></div>
    <details id="sites-panel" style="margin-top:12px">
      <summary class="muted" style="cursor:pointer">Sites de busca</summary>
      <div style="margin-top:10px">
        <textarea id="sites" spellcheck="false" placeholder="https://exemplo.com/"></textarea>
        <div class="row between" style="margin-top:8px">
          <span id="sites-status" class="muted"></span>
          <button id="sites-save" class="ghost">Salvar sites</button>
        </div>
      </div>
    </details>
  </section>

  <section class="card">
    <label for="url">Cole o link e o scraper certo sera detectado automaticamente</label>
    <div class="row" style="margin-top:8px">
      <input id="url" type="url" placeholder="https://..." autocomplete="off" spellcheck="false">
      <select id="force" title="Forcar um scraper especifico">
        <option value="">Auto</option>
        <option value="mirror">Espelho de site</option>
        <option value="ebook">E-book</option>
        <option value="gallery">Galeria</option>
      </select>
      <button id="analyze">Analisar</button>
    </div>
    <p id="status" class="muted" style="margin:10px 0 0"></p>
  </section>

  <section id="result" class="card hidden"></section>

  <section class="card">
    <div class="row between">
      <h2 style="margin:0;font-size:17px">Tarefas</h2>
      <button id="refresh" class="ghost">Atualizar</button>
    </div>
    <div id="tasks"></div>
  </section>
</main>

<script>
const api = {
  async request(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ("Erro " + res.status));
    return data;
  },
  post(path, body) {
    return this.request(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  },
  get(path) {
    return this.request(path, {});
  },
};

const STATUS_LABEL = { pending: "Na fila", running: "Em andamento", done: "Concluida", error: "Erro" };
const $ = (id) => document.getElementById(id);

function el(tag, opts = {}, children = []) {
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.text !== undefined) node.textContent = opts.text;
  if (opts.attrs) for (const [key, value] of Object.entries(opts.attrs)) node.setAttribute(key, value);
  for (const child of children) node.appendChild(child);
  return node;
}

function setStatus(message) {
  $("status").textContent = message;
}

function formatDuration(seconds) {
  if (!seconds) return "";
  const total = Math.round(seconds);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

let current = null;

async function analyze() {
  const url = $("url").value.trim();
  const force = $("force").value || null;
  const result = $("result");
  if (!url) { setStatus("Cole um link primeiro."); return; }
  setStatus("Analisando...");
  result.classList.add("hidden");
  result.replaceChildren();
  try {
    const detected = await api.post("/api/detect", { url, force });
    const info = await api.post("/api/info", { url, force });
    current = { url, force, info, kind: detected.kind, scraperId: detected.scraper_id };
    setStatus(`Scraper detectado: ${detected.label} (${detected.kind})`);
    renderResult(result, info, detected.kind);
    result.classList.remove("hidden");
  } catch (err) {
    current = null;
    setStatus("Erro: " + err.message);
  }
}

function renderResult(container, info, kind) {
  container.replaceChildren();
  const head = el("div", { class: "result-head" });
  if (info.cover) head.appendChild(el("img", { class: "cover", attrs: { src: info.cover, alt: "" } }));
  const meta = el("div", { class: "result-meta" });
  meta.appendChild(el("h2", { text: info.title || "Sem titulo" }));
  meta.appendChild(el("p", { class: "muted", text: `${(info.items || []).length} item(ns) disponivel(is)` }));
  if (info.duration) meta.appendChild(el("p", { class: "muted", text: "Duracao: " + formatDuration(info.duration) }));
  head.appendChild(meta);
  container.appendChild(head);
  if (kind === "manga") container.appendChild(renderManga(info));
  else if (kind === "video") container.appendChild(renderVideo(info));
  else container.appendChild(renderGeneric(info, kind));
}

function renderGeneric(info, kind) {
  const labels = {
    image: "Baixar galeria",
    ebook: "Baixar e-book",
    file: "Baixar arquivo",
    site: "Espelhar site",
  };
  const wrap = el("div", { class: "controls" });
  const button = el("button", { text: labels[kind] || "Baixar" });
  button.addEventListener("click", () => {
    startDownload((info.items || []).map((item) => item.id), {});
  });
  wrap.appendChild(button);
  return wrap;
}

function renderManga(info) {
  return renderSelectableList(info, [
    { id: "cbz", label: "Empacotar em CBZ" },
  ], "capitulo");
}

// Lista com checkboxes + "Selecionar todos" (manga, episodios etc.)
function renderSelectableList(info, options, unit) {
  const wrap = el("div");
  const controls = el("div", { class: "controls" });
  const selectAll = el("label", { class: "check" });
  const selectAllBox = el("input", { attrs: { type: "checkbox" } });
  selectAll.append(selectAllBox, el("span", { text: "Selecionar todos" }));
  const optionBoxes = options.map((opt) => {
    const label = el("label", { class: "check" });
    const box = el("input", { attrs: { type: "checkbox" } });
    label.append(box, el("span", { text: opt.label }));
    return { id: opt.id, box };
  });
  const button = el("button", { text: "Baixar selecionados" });
  controls.append(selectAll, ...optionBoxes.map((o) => o.box.closest("label")), button);

  const list = el("div", { class: "chapters" });
  const boxes = [];
  for (const item of info.items || []) {
    const row = el("label", { class: "chapter" });
    const box = el("input", { attrs: { type: "checkbox", value: item.id } });
    row.append(box, el("span", { text: item.label }));
    list.appendChild(row);
    boxes.push(box);
  }
  selectAllBox.addEventListener("change", () => boxes.forEach((box) => { box.checked = selectAllBox.checked; }));
  button.addEventListener("click", () => {
    const ids = boxes.filter((box) => box.checked).map((box) => box.value);
    if (!ids.length) { setStatus(`Selecione ao menos um ${unit}.`); return; }
    const opts = {};
    for (const { id, box } of optionBoxes) opts[id] = box.checked;
    startDownload(ids, opts);
  });
  wrap.append(controls, list);
  return wrap;
}

function renderVideo(info) {
  const items = info.items || [];
  // serie de episodios (animestream): lista selecionavel
  if (items.length > 1 && !info.is_playlist) {
    return renderSelectableList(info, [], "episodio");
  }
  const wrap = el("div", { class: "controls" });
  const label = info.is_playlist ? `Baixar playlist (${items.length} itens)` : "Baixar video";
  const button = el("button", { text: label });
  button.addEventListener("click", () => {
    startDownload(items.map((item) => item.id), {});
  });
  wrap.appendChild(button);
  return wrap;
}

async function startDownload(items, options) {
  if (!current) return;
  try {
    const res = await api.post("/api/download", { url: current.url, items, options, force: current.force });
    setStatus("Tarefa criada: " + res.task_id.slice(0, 8));
    await pollTasks();
  } catch (err) {
    setStatus("Erro: " + err.message);
  }
}

function renderTasks(tasks) {
  const container = $("tasks");
  container.replaceChildren();
  if (!tasks.length) {
    container.appendChild(el("p", { class: "muted", text: "Nenhuma tarefa ainda." }));
    return;
  }
  tasks.slice().reverse().forEach((task) => container.appendChild(renderTask(task)));
}

function renderTask(task) {
  const card = el("div", { class: "task" });
  const top = el("div", { class: "task-top" });
  top.append(
    el("span", { class: `badge ${task.status}`, text: STATUS_LABEL[task.status] || task.status }),
    el("span", { class: "muted", text: task.id.slice(0, 8) })
  );
  const bar = el("div", { class: "bar" });
  const fill = el("div", { class: `fill ${task.status}` });
  fill.style.width = Math.max(0, Math.min(100, task.progress || 0)) + "%";
  bar.appendChild(fill);
  card.append(top, bar);
  if (task.current_item) card.appendChild(el("p", { class: "muted", text: task.current_item }));
  if (task.error) card.appendChild(el("p", { class: "error", text: task.error }));
  card.appendChild(el("pre", { class: "log", text: (task.log || []).join("\n") }));
  return card;
}

async function pollTasks() {
  try {
    renderTasks(await api.get("/api/tasks"));
  } catch (err) {
    /* mantem a ultima lista em caso de falha temporaria */
  }
}

function setSearchStatus(message) {
  $("search-status").textContent = message;
}

function setSitesStatus(message) {
  $("sites-status").textContent = message;
}

async function searchAnime() {
  const term = $("search").value.trim();
  const results = $("search-results");
  if (!term) { setSearchStatus("Digite um nome para buscar."); return; }
  setSearchStatus("Buscando...");
  results.classList.add("hidden");
  results.replaceChildren();
  try {
    const data = await api.post("/api/search", { term });
    renderSearchResults(data);
    const hosts = Object.keys(data.erros || {});
    const sufixo = hosts.length ? ` (falha: ${hosts.join(", ")})` : "";
    setSearchStatus(`${(data.resultados || []).length} resultado(s) encontrado(s)${sufixo}.`);
  } catch (err) {
    setSearchStatus("Erro: " + err.message);
  }
}

function renderSearchResults(data) {
  const container = $("search-results");
  container.replaceChildren();
  const items = data.resultados || [];
  if (!items.length) {
    container.appendChild(el("p", { class: "muted", text: "Nenhum resultado encontrado." }));
    container.classList.remove("hidden");
    return;
  }
  for (const item of items) container.appendChild(renderSearchItem(item));
  container.classList.remove("hidden");
}

function renderSearchItem(item) {
  const row = el("div", { class: "search-item" });
  const info = el("div");
  info.appendChild(el("div", { class: "search-title", text: item.title || "Sem titulo" }));
  info.appendChild(el("div", { class: "muted", text: `${item.site} · ${item.idioma}` }));
  const actions = el("div", { class: "search-actions" });
  const use = el("button", { class: "ghost", text: "Usar" });
  use.addEventListener("click", () => { $("url").value = item.url; analyze(); });
  const verify = el("button", { class: "ghost", text: "Verificar qualidade" });
  const quality = el("span", { class: "muted" });
  verify.addEventListener("click", async () => {
    quality.textContent = "Verificando...";
    try {
      const res = await api.post("/api/search_verify", { url: item.url });
      quality.textContent = `${res.qualidade} · ${res.episodios} eps`;
    } catch (err) {
      quality.textContent = err.message;
    }
  });
  actions.append(use, verify, quality);
  row.append(info, actions);
  return row;
}

async function loadSites() {
  try {
    const data = await api.get("/api/sites");
    $("sites").value = (data.sites || []).join("\n");
  } catch (err) {
    setSitesStatus("Erro: " + err.message);
  }
}

async function saveSites() {
  const urls = $("sites").value.split("\n").map((line) => line.trim()).filter(Boolean);
  try {
    const data = await api.post("/api/sites", { sites: urls });
    $("sites").value = (data.sites || []).join("\n");
    setSitesStatus("Sites salvos.");
  } catch (err) {
    setSitesStatus("Erro: " + err.message);
  }
}

$("search-btn").addEventListener("click", searchAnime);
$("search").addEventListener("keydown", (event) => { if (event.key === "Enter") searchAnime(); });
$("sites-save").addEventListener("click", saveSites);
$("analyze").addEventListener("click", analyze);
$("url").addEventListener("keydown", (event) => { if (event.key === "Enter") analyze(); });
$("refresh").addEventListener("click", pollTasks);
loadSites();
pollTasks();
setInterval(pollTasks, 1500);
</script>
</body>
</html>
